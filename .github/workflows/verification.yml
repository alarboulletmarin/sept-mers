# La barrière de qualité du projet, exécutée à chaque poussée.
#
# Le README annonce cinq vérifications ; jusqu'ici rien ne les lançait, et les
# quatre parcours navigateur pointaient un Chromium qui n'existait que sur une
# machine. Ce workflow est la seule chose qui fasse de ces scripts une garantie
# plutôt qu'une intention.

name: Vérification

on:
  push:
    branches: ['**']
  pull_request:

# Une poussée de plus sur la même branche annule la vérification en cours :
# c'est le dernier état qui compte, pas la file.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La même majeure que `engines.node` et que Vercel.
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Types, tests et build
        run: npm run verify

      # Le navigateur ne sert qu'aux quatre parcours : on ne prend que Chromium,
      # et on le met en cache par version de Playwright.
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Parcours complet
        run: node scripts/smoke.mjs

      - name: Mode avion et thème système
        run: node scripts/offline.mjs

      - name: Absence de scroll latéral
        run: node scripts/nooverflow.mjs

      - name: Contraste dans les deux thèmes
        run: node scripts/contrast.mjs
